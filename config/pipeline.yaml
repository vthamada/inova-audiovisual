schema_version: "1.0"
network_policy: deny_by_default
workspace_root: workspace
log:
  level: INFO
  format: human
tools:
  ffmpeg: C:/ffmpeg/bin/ffmpeg.exe
  ffprobe: C:/ffmpeg/bin/ffprobe.exe
  node: .tools/node-v24.18.0-win-x64/node.exe
  npm: .tools/node-v24.18.0-win-x64/npm.cmd
  hyperframes: node_modules/.bin/hyperframes.cmd
tool_requirements:
  node_prefix: "24."
  hyperframes_version: "0.7.82"
  ffmpeg_prefix: "ffmpeg version N-123158-gcef2fbfd4b-20260304"
  ffprobe_prefix: "ffprobe version N-123158-gcef2fbfd4b-20260304"
ingest:
  allowed_extensions:
    - .mp4
    - .mov
    - .m4v
    - .mkv
    - .webm
  max_source_bytes: 53687091200
  min_free_bytes: 2147483648
  copy_chunk_bytes: 1048576
  probe_timeout_seconds: 120
  proxy:
    width: 1280
    height: 720
    fps: 30
    video_codec: libx264
    audio_codec: aac
    crf: 23
    preset: veryfast
    audio_bitrate: 128k
    timeout_seconds: 7200
transcription:
  provider: faster-whisper
  provider_version: 1.2.1
  model: small
  model_path: models/faster-whisper/small
  model_revision: 536b0662742c02347bc0e980a01041f333bce120
  device: cpu
  compute_type: int8
  language: pt
  local_files_only: true
  vad_filter: true
  vad_min_silence_duration_ms: 2000
render:
  draft_profile: draft
  final_profile: high
  fps: 30
  workers: 1
approval:
  require_transcript_review: true
  require_image_authorization: true
  require_licensed_assets: true
  allow_bypass: false
