schema_version: "1.0"
network_policy: deny_by_default
workspace_root: workspace
log:
  level: INFO
  format: human
tools:
  ffmpeg: C:/ffmpeg/bin/ffmpeg.exe
  ffprobe: C:/ffmpeg/bin/ffprobe.exe
  node: .tools/node-v24.18.0-win-x64/node.exe
  npm: .tools/node-v24.18.0-win-x64/npm.cmd
  hyperframes: node_modules/.bin/hyperframes.cmd
tool_requirements:
  node_prefix: "24."
  hyperframes_version: "0.7.82"
  ffmpeg_prefix: "ffmpeg version N-123158-gcef2fbfd4b-20260304"
  ffprobe_prefix: "ffprobe version N-123158-gcef2fbfd4b-20260304"
transcription:
  provider: faster-whisper
  model: small
  device: cpu
  compute_type: int8
  language: pt
  local_files_only: true
render:
  draft_profile: draft
  final_profile: high
  fps: 30
  workers: 1
approval:
  require_transcript_review: true
  require_image_authorization: true
  require_licensed_assets: true
  allow_bypass: false
